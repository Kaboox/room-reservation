spring.application.name=room-reservation
spring.datasource.url=jdbc:postgresql://db:5432/room_reservation
spring.datasource.username=postgres
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


jwt.secret.key=ultra_secret_extremely_unordinary_key

# Wlaczenie endpointu dla Prometheusa
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
# Dodanie tagu 'application', zeby latwiej bylo filtrowac dane w Grafanie
management.metrics.tags.application=room-reservation-app