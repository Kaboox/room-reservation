services:
  postgres:
    image: postgres:16-alpine
    container_name: room-reservation-postgres
    environment:
      POSTGRES_DB: room_reservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - room_reservation_db:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: room-reservation-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/room_reservation
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin123
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: room-reservation-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  ngrok:
    build:
      context: .
      dockerfile: Dockerfile.ngrok
    container_name: room-reservation-ngrok
    depends_on:
      - backend
    ports:
      - "4040:4040"

volumes:
  room_reservation_db:
