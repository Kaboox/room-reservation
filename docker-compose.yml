services:
  # Baza danych PostgreSQL (zamiast tej lokalnej, do której nie masz hasła)
  db:
    image: postgres:15
    container_name: room_reservation_db
    environment:
      POSTGRES_DB: room_reservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"

  # Prometheus - zbiera metryki z Twojej aplikacji
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # Grafana - rysuje ładne wykresy
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
