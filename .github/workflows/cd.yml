name: CD - Publish Docker Images

on:
  push:
    tags:
      - 'v*' # Uruchom tylko jak tag zaczyna się od "v", np. v1.0.0

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu (Checkout)
        uses: actions/checkout@v4

      - name: Logowanie do Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Konfiguracja Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- BACKEND ---
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ngrok.frontend.backend.backend.backend
          push: true
          tags: |
            kabox/room-reservation-backend:latest
            kabox/room-reservation-backend:${{ github.ref_name }}

      # --- FRONTEND ---
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./src/main/resources/static/room-reservation-frontend
          file: ./Dockerfile.ngrok.frontend.backend.backend.frontend
          push: true
          tags: |
            TWOJ_LOGIN_DOCKER/room-reservation-frontend:latest
            TWOJ_LOGIN_DOCKER/room-reservation-frontend:${{ github.ref_name }}
