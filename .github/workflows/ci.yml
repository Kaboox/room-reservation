name: CI - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- JOB 1: BACKEND (JAVA) ---
  build-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Pobranie kodu (Checkout)
      uses: actions/checkout@v4

    - name: Konfiguracja Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build, Test & Lint (Maven)
      run: mvn verify

  # --- JOB 2: FRONTEND (REACT) ---
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/main/resources/static/room-reservation-frontend

    steps:
    - name: Pobranie kodu (Checkout)
      uses: actions/checkout@v4

    - name: Konfiguracja Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './src/main/resources/static/room-reservation-frontend/package-lock.json'

    - name: Instalacja zależności
      run: npm ci

    - name: Linting kodu
      run: npm run lint
      continue-on-error: true

    - name: Próbne budowanie (Build)
      run: npm run build
